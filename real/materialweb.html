<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Material Web (Google)</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Material+Symbols+Outlined" rel="stylesheet">
<script type="importmap">{"imports":{"@material/web/":"https://esm.run/@material/web/"}}</script>
<script type="module">
import '@material/web/all.js';
import {styles as typescaleStyles} from '@material/web/typography/md-typescale-styles.js';
document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
</script>
<style>body{font-family:Roboto,sans-serif;margin:0;background:#fef7ff;color:#1d1b20;padding-bottom:40px}
.bar{display:flex;align-items:center;gap:12px;padding:12px 16px}
h1{font-size:28px;font-weight:400;margin:4px 20px 16px}
.card{background:#fff;border-radius:16px;margin:0 16px;padding:20px;border:1px solid #e7e0ec}
.v{font-size:30px;margin-top:6px}
.l{font-size:14px;color:#49454f}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px}
.row .t{flex:1}.row b{font-weight:400;font-size:16px;display:block}.row span{font-size:13px;color:#49454f}
</style></head><body>
<div class="bar"><md-icon-button><md-icon>menu</md-icon></md-icon-button><div style="flex:1;font-size:20px">CloudFin</div><md-icon-button><md-icon>search</md-icon></md-icon-button><md-icon-button><md-icon>notifications</md-icon></md-icon-button></div>
<h1>Финансы за октябрь</h1>
<div style="display:flex;gap:8px;padding:0 16px 16px"><md-filter-chip label="Все" selected></md-filter-chip><md-filter-chip label="Приход"></md-filter-chip><md-filter-chip label="Расход"></md-filter-chip></div>
<div class="card"><div class="l">Баланс по кассе</div><div class="v">4 820 000 сум</div>
<div style="margin-top:14px"><md-assist-chip label="↑ 12,4% к сентябрю"></md-assist-chip></div></div>
<div style="padding:22px 20px 6px;color:#6750a4;font-size:14px">Последние операции</div>
<md-list style="margin:0 16px;border-radius:16px;--md-list-container-color:#fff;border:1px solid #e7e0ec;overflow:hidden">
<md-list-item><div slot="headline">Поступление от Argus</div><div slot="supporting-text">Сегодня, 09:12</div><div slot="trailing-supporting-text">+1 200 000</div></md-list-item>
<md-divider></md-divider>
<md-list-item><div slot="headline">Аренда офиса</div><div slot="supporting-text">Вчера, 18:40</div><div slot="trailing-supporting-text">−850 000</div></md-list-item>
<md-divider></md-divider>
<md-list-item><div slot="headline">Подписка Figma</div><div slot="supporting-text">14 октября</div><div slot="trailing-supporting-text">−186 000</div></md-list-item>
<md-divider></md-divider>
<md-list-item><div slot="headline">Возврат переплаты</div><div slot="supporting-text">12 октября</div><div slot="trailing-supporting-text">+94 000</div></md-list-item>
</md-list>
<div style="padding:20px 16px"><md-filled-button style="width:100%">Новая операция</md-filled-button></div>
</body></html>
